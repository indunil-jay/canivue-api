[project]
name = "canivue-api"
version = "0.1.0"
description = "FastAPI Modular Monolith with Feature-Based Clean Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
# Heavy training/inference frameworks -- see requirements-ml.txt.
# Install with: pip install -e ".[ml]"
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.39.0",
    "scikit-learn>=1.4.0",
    "opencv-python-headless>=4.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
